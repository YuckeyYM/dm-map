<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>デジタルマーケティングの地図</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DMの地図">

<style>
:root{
  --bg:#ffffff; --ink:#141414; --sub:#6b6b6b; --line:#e1e2e6;
  --accent:#2c3e6b; --accent-soft:#eef0f6; --wash:#f8f9fa;
  --up:#1f6b3f; --down:#8b1a1a;
  --serif:"Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);
  -webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 16px 0}
h1{font-family:var(--serif);font-size:19px;letter-spacing:.06em;margin:0 0 2px;font-weight:600}
.tagline{font-size:10.5px;color:var(--sub);letter-spacing:.14em;margin:0 0 10px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;appearance:none;background:none;border:none;font:inherit;font-size:13px;
  color:var(--sub);padding:8px 12px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
main{padding:18px 16px calc(env(safe-area-inset-bottom) + 40px);max-width:720px;margin:0 auto}
section[hidden]{display:none!important}
.lede{font-size:13px;color:var(--sub);margin:0 0 18px;padding-left:11px;border-left:2px solid var(--accent)}
h2{font-family:var(--serif);font-size:15px;letter-spacing:.05em;margin:26px 0 4px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
h2:first-of-type{margin-top:2px}
.h2note{font-size:12px;color:var(--sub);margin:0 0 12px}
/* layer cards */
.card{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;background:#fff;
  border-left:3px solid var(--accent)}
.card.data{border-left-color:#5b7ba8;background:var(--accent-soft)}
.card.gov{border-left-color:#8a8a8a;background:var(--wash)}
.cardtop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.lnum{flex:0 0 22px;height:22px;border-radius:5px;background:var(--accent);color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;font-weight:700}
.card.gov .lnum{background:#8a8a8a}
.lname{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.03em}
.llatin{font-size:9.5px;color:var(--sub);letter-spacing:.12em}
.lrole{font-size:13px;margin:8px 0 0;color:#333}
.toolbox{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.ttoggle{appearance:none;background:none;border:none;font:inherit;font-size:11.5px;color:var(--accent);
  padding:2px 0;cursor:pointer;letter-spacing:.03em;font-weight:700}
.ttoggle::after{content:" \25BE"}
.toolbox.open .ttoggle::after{content:" \25B4"}
.tlist{display:none;margin-top:6px}
.toolbox.open .tlist{display:block}
.titem{padding:5px 0;border-bottom:1px dotted var(--line)}
.titem:last-child{border-bottom:none}
.tn{font-size:12.5px;font-weight:700}
.td{font-size:12px;color:#444;line-height:1.55}
.miss{font-size:12px;margin:9px 0 0;padding:8px 10px;background:var(--wash);border-radius:8px;color:#333}
.miss b{color:var(--accent)}
.card.data .miss,.card.gov .miss{background:#fff}
.kpi{font-size:11px;color:var(--sub);margin:7px 0 0;letter-spacing:.02em}
.kpi b{color:var(--ink);font-weight:600}
/* steps */
.step{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.step:last-child{border-bottom:none}
.num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;
  display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.step.soft .num{background:#9aa4bb}
.sbody{flex:1;min-width:0}
.sname{font-weight:700;font-size:14.5px}
.sen{font-size:10px;color:var(--sub);letter-spacing:.09em;margin-left:6px;font-weight:400}
.srole{font-size:13px;color:#333;margin-top:2px}
.smore{font-size:12.5px;color:#444;margin-top:8px;padding:9px 11px;background:var(--wash);
  border-radius:8px;display:none;line-height:1.75}
.step.open .smore{display:block}
.smore b{color:var(--accent);font-weight:600}
.tap{font-size:10.5px;color:var(--sub);text-align:right;margin:-6px 0 6px}
/* aio blocks */
.blk{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;background:#fff}
.blk h3{font-size:13.5px;margin:0 0 7px;letter-spacing:.02em}
.blk p{font-size:13px;margin:0 0 8px;color:#333}
.blk p:last-child{margin-bottom:0}
.blk b{color:var(--accent)}
.lever{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.lever:last-child{border-bottom:none;padding-bottom:0}
.lvn{flex:0 0 22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;font-weight:700}
.lvb{flex:1;min-width:0}
.lvt{font-weight:700;font-size:13.5px}
.lvd{font-size:12.5px;color:#333;margin-top:2px;line-height:1.65}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  background:var(--accent-soft);padding:1px 5px;border-radius:4px;color:var(--accent)}
.warn{border-left:3px solid #b8860b;background:#fdfaf2}
/* terms */
.term{border-bottom:1px solid var(--line);padding:10px 0}
.term:last-child{border-bottom:none}
.tname2{font-weight:700;font-size:14px}
.tdef{font-size:13px;color:#333;margin-top:1px}
/* tables */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 6px}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:400px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{font-size:11px;color:var(--sub);font-weight:600;border-bottom:1px solid #ccced4}
tbody tr.total td{font-weight:700;border-top:1px solid #ccced4}
td.neg{color:var(--down)} td.pos{color:var(--up)}
.src{font-size:11px;color:var(--sub);margin:8px 0 0;line-height:1.8}
/* quiz */
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-bottom:8px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qtext{font-family:var(--serif);font-size:17px;line-height:1.65;margin:0 0 16px}
.opts{display:grid;gap:8px}
.opt{appearance:none;text-align:left;font:inherit;font-size:14px;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--ink);line-height:1.5}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--up);background:#f0f7f2;color:var(--up);font-weight:700}
.opt.wrong{border-color:var(--down);background:#faf0f0;color:var(--down)}
.expl{font-size:13px;color:#333;background:var(--wash);border-radius:10px;padding:12px 14px;margin-top:14px;display:none}
.expl.show{display:block}
.btn{appearance:none;font:inherit;font-size:14px;font-weight:700;border:none;border-radius:10px;
  background:var(--accent);color:#fff;padding:13px 20px;width:100%;margin-top:14px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.score{text-align:center;padding:24px 0 8px}
.score .n{font-family:var(--serif);font-size:46px;color:var(--accent);line-height:1}
.score .l{font-size:13px;color:var(--sub);margin-top:6px}
.wrongs{font-size:13px;margin-top:18px}
.wrongs h3{font-size:12px;color:var(--sub);font-weight:600;margin:0 0 6px}
.wrongs li{margin-bottom:5px}
footer{font-size:11px;color:var(--sub);text-align:center;padding:24px 16px 40px;line-height:1.9;
  border-top:1px solid var(--line);margin-top:30px}
</style>
</head>
<body>
<header>
  <h1>デジタルマーケティングの地図</h1>
  <p class="tagline">DIGITAL MARKETING MAP</p>
  <nav id="nav"></nav>

<main>
  <section id="p-map"></section>

  <section id="p-num" hidden></section>
  <section id="p-quiz" hidden></section>

const $=s=>document.querySelector(s);

function layerCard(L,i){
  let h='<div class="card '+L.k+'">'+
    '<div class="cardtop"><span class="lnum">'+(i+1)+'</span>'+
    '<span class="lname">'+L.n+'</span><span class="llatin">'+L.l+'</span></div>'+
    '<p class="lrole">'+L.r+'</p>'+
    '<div class="toolbox" data-tool><button class="ttoggle">この層の道具 '+L.t.length+'</button><div class="tlist">';
  L.t.forEach(t=>{h+='<div class="titem"><div class="tn">'+t[0]+'</div><div class="td">'+t[1]+'</div></div>'});
  h+='</div></div><p class="miss">'+L.m+'</p><p class="kpi">この層のKPI：'+L.kpi+'</p></div>';
  return h;
}
function renderMap(){
  let h='<p class="lede">デジタルマーケティングは7つの層でできている。上の4層が「客の流れ」、下の3層が「それを支える仕組み」。<b>どの層の話をしているのかが分かれば、たいていの会議は追える。</b></p>';
  h+='<h2>客に向かう4層</h2><p class="h2note">上から順に、遠い人から近い人へ。</p>';
  h+=LAYERS.slice(0,4).map((L,i)=>layerCard(L,i)).join('');
  h+='<h2>支える3層</h2><p class="h2note">目立たないが、ここが弱いと上の4層が機能しない。</p>';
  h+=LAYERS.slice(4).map((L,i)=>layerCard(L,i+4)).join('');
  $('#p-map').innerHTML=h;
  $('#p-map').querySelectorAll('[data-tool] .ttoggle').forEach(b=>{
    b.addEventListener('click',e=>{e.stopPropagation();b.parentElement.classList.toggle('open')});
  });
}
function stepList(arr,soft){
  return arr.map((s,i)=>'<div class="step'+(soft?' soft':'')+'" data-step>'+
    '<div class="num">'+(i+1)+'</div><div class="sbody">'+
    '<div class="sname">'+s.n+'<span class="sen">'+s.e+'</span></div>'+
    '<div class="srole">'+s.r+'</div>'+
    (s.m?'<div class="smore">'+s.m+'</div>':'')+
  '</div></div>').join('');
}
function renderFlow(){
  let h='<p class="lede">層の地図に、二本の流れを重ねると全体が動き出す。<b>客の流れ</b>と<b>データの流れ</b>は別物で、片方だけ設計すると必ずどこかで切れる。</p>';
  h+='<h2>客の流れ ― 遠い人が近くなるまで</h2><p class="h2note">戻ったり飛ばしたりする。順番どおりには進まない。</p>';
  h+='<p class="tap">各行をタップすると補足が出ます</p>'+stepList(CUST,false);
  h+='<h2>データの流れ ― 行動が判断になるまで</h2><p class="h2note">この一周が閉じて初めて「学習する組織」になる。</p>'+stepList(DATAFLOW,true);
  $('#p-flow').innerHTML=h;
  $('#p-flow').querySelectorAll('[data-step]').forEach(el=>{
    el.addEventListener('click',()=>el.classList.toggle('open'));
  });
}
function renderAio(){
  let h='<p class="lede">AI Optimization（AIO）。生成AIの回答に自社が引用されるようにする話。用語が乱立していて売り込みも多い領域なので、<b>事実だけを置きます。</b></p>';
  AIO.forEach(b=>{
    h+='<div class="blk'+(b.warn?' warn':'')+'"><h3>'+b.h+'</h3>';
    if(b.p)b.p.forEach(p=>h+='<p>'+p+'</p>');
    if(b.lever){
      h+='<div>';
      b.lever.forEach((l,i)=>{
        h+='<div class="lever"><div class="lvn">'+(i+1)+'</div><div class="lvb">'+
           '<div class="lvt">'+l[0]+'</div><div class="lvd">'+l[1]+'</div></div></div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  h+='<p class="src">出典：Google 検索セントラル「AI features and your website」、OpenAI「Bots」ドキュメント、Similarweb クリックストリーム（2026年1〜4月・米国、SparkToro 集計）、Similarweb AI Search 統計（2026年5月）。</p>';
  $('#p-aio').innerHTML=h;
}
function renderWords(){
  let h='<p class="lede">会議で意味が取れないと止まる言葉だけを12個。<b>ROAS と増分ROAS</b>、<b>CVR の分母</b>あたりは、知らないと議論が空回りします。</p><h2>最低限の12語</h2><div>';
  h+=TERMS.map(t=>'<div class="term"><div class="tname2">'+t.n+'</div><div class="tdef">'+t.d+'</div></div>').join('');
  $('#p-word').innerHTML=h+'</div>';
}
function adTable(rows,unit){
  let h='<div class="tblwrap"><table><thead><tr><th>媒体</th><th>金額</th><th>前年比</th><th>構成比</th></tr></thead><tbody>';
  rows.forEach(r=>{
    const cls=r[2]>=100?'pos':'neg';
    h+='<tr><td>'+r[0]+'</td><td>'+r[1].toLocaleString()+'</td>'+
       '<td class="'+cls+'">'+r[2].toFixed(1)+'%</td><td>'+r[3]+'</td></tr>';
  });
  return h+'</tbody></table></div><p class="src">単位：'+unit+'</p>';
}
function renderNum(){
  let h='<p class="lede">数字は毎年動きますが、<b>構造</b>は当分変わりません。「ネットが過半」「運用型が9割」「動画が3割」——この3つを押さえれば、たいていの議論は位置づけられます。</p>';
  h+='<h2>2025年 日本の広告費</h2><p class="h2note">総広告費 8兆623億円（前年比 105.1%）。インターネットが初めて過半数（50.2%）に達した年。</p>';
  h+=adTable(AD25,'億円');
  h+='<h2>インターネット広告媒体費の中身</h2><p class="h2note">媒体費の総額は3兆3,093億円（前年比 111.8%）。※ソーシャルとビデオは運用型の内訳。</p>';
  h+=adTable(NET25,'億円');
  h+='<h2>AI検索まわり</h2>';
  h+='<div class="tblwrap"><table><thead><tr><th>指標</th><th>値</th><th>時点</th></tr></thead><tbody>'+
     '<tr><td>クリックせず終わるGoogle検索</td><td>68.0%</td><td>2026年1〜4月</td></tr>'+
     '<tr><td>同（2024年）</td><td>60.5%</td><td>2024年</td></tr>'+
     '<tr><td>AI Mode に到達した検索</td><td>0.34%</td><td>2026年1〜4月</td></tr>'+
     '<tr><td>ChatGPT の回答に出典が付く割合</td><td>6.8%</td><td>2026年5月</td></tr>'+
     '<tr><td>同（1年前）</td><td>1.6%</td><td>2025年6月</td></tr>'+
     '</tbody></table></div><p class="src">米国データ。Similarweb クリックストリーム／AI Search 統計。</p>';
  h+='<h2>読み方のメモ</h2><p class="h2note" style="margin-bottom:0">';
  h+='・<b>「AI経由が増えた」のではなく「検索経由が減った」</b>。AI Mode の流量はまだ0.34%で、失われたクリックの行き先はAIではなく「どこにも行かない」。<br>';
  h+='・成果報酬型だけが前年割れ。<b>中間業者を通す買い方が構造的に縮んでいる</b>。<br>';
  h+='・Privacy Sandbox は2025年10月に主要APIの廃止が発表され、<b>サードパーティCookieは維持</b>された。「クッキーレス」を前提にした計画は前提から見直しが要る。';
  h+='</p>';
  $('#p-num').innerHTML=h;
}
/* ============ QUIZ ============ */
let qs=[],qi=0,qscore=0,qwrong=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(){
  qs=shuffle(QUIZ).slice(0,10).map(q=>{
    const correct=q.o[q.a], opts=shuffle(q.o);
    return {q:q.q,o:opts,a:opts.indexOf(correct),e:q.e};
  });
  qi=0;qscore=0;qwrong=[];drawQ();
}
function drawQ(){
  const el=$('#p-quiz');
  if(qi>=qs.length){
    let h='<div class="score"><div class="n">'+qscore+' / '+qs.length+'</div><div class="l">'+
      (qscore>=9?'この領域の会議で困ることはありません':qscore>=6?'骨格は入っています。地図をもう一巡':'まず「地図」と「流れ」を読み直しましょう')+'</div></div>';
    if(qwrong.length)h+='<div class="wrongs"><h3>間違えたところ</h3><ul>'+qwrong.map(w=>'<li>'+w+'</li>').join('')+'</ul></div>';
    h+='<button class="btn" id="again">もう一度（10問）</button><button class="btn ghost" id="toMap">地図に戻る</button>';
    el.innerHTML=h;
    $('#again').onclick=startQuiz;
    $('#toMap').onclick=()=>show('map');
    return;
  }
  const q=qs[qi];
  el.innerHTML='<div class="qmeta"><span>第 '+(qi+1)+' 問 / '+qs.length+'</span><span>正解 '+qscore+'</span></div>'+
    '<div class="bar"><i style="width:'+(qi/qs.length*100)+'%"></i></div>'+
    '<p class="qtext">'+q.q+'</p>'+
    '<div class="opts">'+q.o.map((o,i)=>'<button class="opt" data-i="'+i+'">'+o+'</button>').join('')+'</div>'+
    '<div class="expl" id="expl">'+q.e+'</div>'+
    '<button class="btn" id="next" style="display:none">次へ</button>';
  el.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      const i=+b.dataset.i, ok=i===q.a;
      el.querySelectorAll('.opt').forEach((x,xi)=>{
        x.disabled=true;
        if(xi===q.a)x.classList.add('right'); else if(xi===i)x.classList.add('wrong');
      });
      if(ok)qscore++; else qwrong.push(q.q.replace(/<[^>]+>/g,''));
      $('#expl').classList.add('show');
      const n=$('#next');n.style.display='block';
      n.onclick=()=>{qi++;drawQ();};
    };
  });
}
/* ============ NAV ============ */
const TABS=[['map','地図'],['flow','流れ'],['aio','AIO'],['word','用語'],['num','数字'],['quiz','クイズ']];
function show(k){
  TABS.forEach(([id])=>{
    $('#p-'+id).hidden=(id!==k);
    $('#tab-'+id).setAttribute('aria-selected',id===k?'true':'false');
  });
  window.scrollTo(0,0);
  try{localStorage.setItem('dmm.tab',k)}catch(e){}
  if(k==='quiz'&&!qs.length)startQuiz();
}
$('#nav').innerHTML=TABS.map(([id,t])=>'<button id="tab-'+id+'" role="tab" aria-selected="false">'+t+'</button>').join('');
TABS.forEach(([id])=>{$('#tab-'+id).onclick=()=>show(id)});

renderMap();renderFlow();renderAio();renderWords();renderNum();
let start='map';
try{const s=localStorage.getItem('dmm.tab');if(s&&TABS.some(t=>t[0]===s))start=s}catch(e){}
show(start);
</script>
